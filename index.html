<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4d43b9">
  <meta name="description" content="カドタンといっしょに、みんなでひとつのこまを進める協力すごろく。10の活動を友達と楽しもう。">
  <title>カドタンと協力すごろく</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="カドタンと協力すごろく">
        <span class="brand-mark" aria-hidden="true"><span>●</span><span>●</span><span>●</span></span>
        <span><span class="brand-kicker">カドタンといっしょに</span><h1>きょうりょくすごろく</h1></span>
      </a>
      <nav class="toolbar" aria-label="先生の操作">
        <button class="icon-button" id="help-button" title="つかいかた" aria-label="つかいかた"></button>
        <button class="icon-button" id="sound-button" title="効果音 オン" aria-label="効果音 オン" aria-pressed="true"></button>
        <button class="icon-button fullscreen-button" id="fullscreen-button" title="大きく表示" aria-label="大きく表示"></button>
        <button class="settings-button" id="settings-button"><span id="settings-icon"></span><span>先生の設定</span></button>
      </nav>
    </header>

    <main>
      <div class="game-heading">
        <h2 id="board-heading">いっしょに やってみよう！</h2>
        <span class="lap-badge" id="lap-badge">1しゅうめ</span>
      </div>
      <div class="game-layout">
        <section class="board-panel" aria-labelledby="board-heading">
          <div class="board-topline">
            <span id="start-marker" class="start-marker"><span class="start-pawn" aria-hidden="true"><img src="./assets/kadotan.png" alt="" width="32" height="42"></span><span>スタート</span></span>
            <div class="board-key"><span><i class="key-dot all-dot"></i>みんなで</span><span><i class="key-dot pair-dot"></i>ともだちと</span></div>
          </div>
          <div class="board" id="board" aria-label="10マスのすごろく"></div>
        </section>

        <aside class="control-panel" aria-label="サイコロと進め方">
          <section class="turn-panel" id="turn-panel" aria-live="polite"></section>
          <section class="dice-panel" id="dice-panel"></section>
          <div class="kadotan-note"><img src="./assets/kadotan.png" alt="学校キャラクター カドタン" width="98" height="128"><div><span class="mascot-name">カドタン</span><p id="kadotan-message">みんなの ちからで<br>ゴールを めざそう！</p></div></div>
        </aside>
      </div>
      <footer class="game-footer">
        <div class="footer-actions"><button id="undo-button" class="text-button"></button><button id="restart-button" class="restart-button secondary-button">はじめから</button></div>
        <button id="finish-button" class="finish-button">ここで おしまい</button>
      </footer>
    </main>
  </div>
  <dialog id="activity-dialog" class="activity-dialog" aria-labelledby="activity-title"></dialog>
  <dialog id="teacher-dialog" class="teacher-dialog" aria-labelledby="teacher-title"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
  <noscript><p class="noscript">すごろくを使うには、ブラウザーのJavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
